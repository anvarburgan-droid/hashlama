<style>
:root{
  --room:#170d18; --room2:#241326;
  --felt:#16573d; --felt2:#0b3324;
  --brass:#d9a441; --brass2:#8a5f1c;
  --copper:#c8703f;
  --ivory:#fbf6ea; --ink:#f3ece0; --muted:#a998ad;
  --neon:#ff5bb0; --win:#4fe39a; --lose:#ff6b6b;
  --cred:#cf2236; --cblack:#18121c;
  --panel:#21142a; --line:rgba(217,164,65,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  color:var(--ink);font-family:'Manrope',-apple-system,system-ui,sans-serif;font-weight:500;
  background:
    radial-gradient(ellipse 120% 50% at 50% -5%, rgba(255,91,176,.18), transparent 60%),
    radial-gradient(ellipse 90% 40% at 50% 105%, rgba(200,112,63,.16), transparent 60%),
    repeating-linear-gradient(90deg, var(--room) 0 26px, var(--room2) 26px 27px);
  background-color:var(--room);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
#app{min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

/* ---------- neon sign ---------- */
.neon{font-family:'Russo One',sans-serif;color:#ffe3f2;letter-spacing:.02em;
  text-shadow:0 0 4px #fff,0 0 10px var(--neon),0 0 22px var(--neon),0 0 44px var(--neon);
  animation:flicker 7s infinite}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.55}95%{opacity:1}97%{opacity:.7}98%{opacity:1}}
@media (prefers-reduced-motion:reduce){.neon{animation:none}}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;padding:8px 12px 2px}
header .neon{font-size:24px;flex:1}
.daypill{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.daypill b{color:var(--ink);font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.06);font-size:18px}

/* ---------- table ---------- */
.tablewrap{position:relative;flex:1;min-height:450px;margin:2px 4px 0}
.felt{position:absolute;left:18%;right:18%;top:12%;bottom:12%;border-radius:9999px;
  background:radial-gradient(ellipse at 50% 45%, #1f7550 0%, var(--felt) 45%, var(--felt2) 100%);
  box-shadow:inset 0 0 0 2px rgba(217,164,65,.55), inset 0 0 40px rgba(0,0,0,.55),
    0 0 0 10px #3b2113, 0 0 0 12px var(--brass2), 0 18px 50px rgba(0,0,0,.7)}
.felt::after{content:"Хашлама";position:absolute;left:50%;top:80%;transform:translate(-50%,-50%) rotate(-8deg);
  font-family:'Russo One';font-size:26px;color:rgba(255,255,255,.06);white-space:nowrap}
.pot{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%);text-align:center}
.kazan{font-size:38px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.steam{position:absolute;left:50%;top:-14px;width:40px;height:30px;transform:translateX(-50%)}
.steam i{position:absolute;bottom:0;width:6px;height:18px;border-radius:6px;background:rgba(255,255,255,.35);filter:blur(3px);animation:steam 2.4s infinite}
.steam i:nth-child(1){left:8px}.steam i:nth-child(2){left:17px;animation-delay:.8s}.steam i:nth-child(3){left:26px;animation-delay:1.6s}
@keyframes steam{0%{transform:translateY(6px) scaleY(.6);opacity:0}40%{opacity:.8}100%{transform:translateY(-22px) scaleY(1.3);opacity:0}}
.potamt{font-family:'Russo One';font-size:15px;color:var(--brass);margin-top:2px;text-shadow:0 1px 0 #000}
.potlbl{font-size:11px;color:rgba(255,255,255,.6)}
.board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px;--w:34px}
.trash{position:absolute;left:50%;top:63%;width:40px;margin-left:-20px;font-size:24px;text-align:center}
.trash b{display:block;font-size:11px;color:rgba(255,255,255,.7)}
.trash.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.2)}40%{transform:rotate(12deg) scale(1.25)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}

/* ---------- seats ---------- */
.seat{position:absolute;width:78px;transform:translate(-50%,-50%);text-align:center}
.seat .cards{height:30px;display:flex;justify-content:center;gap:2px;--w:24px;position:relative;z-index:2}
.seat .ava{width:46px;height:46px;margin:-10px auto 0;border-radius:50%;background:#2e1d33;display:grid;place-items:center;
  font-size:26px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 4px 10px rgba(0,0,0,.5);position:relative;z-index:1}
.seat .ava img{width:100%;height:100%;object-fit:cover}
.seat .nm{font-size:12px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(10,5,12,.75);border-radius:8px;padding:1px 4px}
.seat .stk{font-size:11px;color:var(--brass);font-weight:700}
.seat.me .nm{color:#ffe3f2}
.seat.turn .ava{box-shadow:0 0 0 3px var(--neon),0 0 18px var(--neon);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.seat.leader .ava{box-shadow:0 0 0 3px var(--brass),0 0 20px var(--brass)}
.seat.idle{opacity:.55}.seat.turn .cards{--w:30px;height:40px;margin-top:-10px}
.crown{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:18px;z-index:3}
.badge{position:absolute;right:2px;top:24px;font-size:15px;z-index:3;filter:drop-shadow(0 1px 2px #000)}
.bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;background:var(--ivory);color:var(--cblack);
  font-size:11px;font-weight:800;padding:3px 7px;border-radius:9px;z-index:4;margin-bottom:-2px}
.handtag{font-size:10px;color:#fff;background:rgba(0,0,0,.6);border-radius:6px;padding:0 4px;margin-top:1px;white-space:nowrap}
.dchip{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font:800 11px/20px 'Manrope';
  text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 0 0 2px #c33;transform:translate(-50%,-50%);z-index:5}
.empty{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(255,255,255,.12)}

/* ---------- cards ---------- */
.card{width:var(--w);height:calc(var(--w)*1.4);perspective:500px;position:relative;flex:none}
.card .in{position:absolute;inset:0;transform-style:preserve-3d}
.card .f,.card .b{position:absolute;inset:0;border-radius:calc(var(--w)*.13);-webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.45)}
.card .f{background:var(--ivory);color:var(--cblack);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95}
.card .f.r{color:var(--cred)}
.card .rk{font-family:'Russo One';font-size:calc(var(--w)*.46)}
.card .su{font-size:calc(var(--w)*.44)}
.card .b{transform:rotateY(180deg);border:2px solid var(--brass);
  background:radial-gradient(circle at 50% 50%, rgba(217,164,65,.35) 0 18%, transparent 19%),
    repeating-linear-gradient(45deg,#7c1734 0 3px,#5a0f25 3px 6px)}
.card.down .in{transform:rotateY(180deg)}
.card.tap{cursor:pointer}
.card.tap .b{animation:glowcard 1.1s infinite}
@keyframes glowcard{50%{box-shadow:0 0 0 3px var(--neon),0 0 22px var(--neon)}}
.flip .in{animation:flip .75s cubic-bezier(.2,.8,.25,1) both;animation-delay:inherit}
@keyframes flip{0%{transform:rotateY(180deg) scale(1)}55%{transform:rotateY(-12deg) scale(1.25)}100%{transform:rotateY(0) scale(1)}}
.trashfly{animation:trashfly 1.1s ease-in both}
@keyframes trashfly{0%{transform:none;opacity:1}25%{transform:translateY(-8px) rotate(-10deg) scale(1.1)}100%{transform:translate(30px,90px) rotate(260deg) scale(.15);opacity:0}}
.pop{animation:pop .9s ease-out both}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
.dealin{animation:dealin .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes dealin{from{transform:translate(0,-60px) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}

/* ---------- табло хашлам ---------- */
.score{display:flex;gap:6px;padding:4px 10px 0;overflow-x:auto;scrollbar-width:none}
.sc{flex:1 0 98px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:5px 8px;min-width:98px}
.sc i{font-style:normal;font-size:10px;color:var(--muted);font-weight:800}
.sc b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc span{display:block;font-size:10px;color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc.done{border-color:rgba(217,164,65,.5);background:rgba(217,164,65,.08)}
.sc.live{border-color:var(--neon)}
.sc.none b{color:var(--muted);font-weight:700}
.tablewrap~*,#score,header,#demobar{flex-shrink:0}
.limitnote{font-size:10.5px;color:var(--muted);text-align:center;padding:3px 0 0}

/* ---------- победа ---------- */
.winban{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:7;pointer-events:none}
.winban .wb{background:linear-gradient(180deg,#ffe597,#d9a441);color:#2a1606;border-radius:16px;padding:7px 14px 8px;text-align:center;min-width:150px;
  box-shadow:0 0 0 3px rgba(255,255,255,.25),0 0 44px rgba(255,210,100,.75)}
.wt{font-size:11px;font-weight:800;letter-spacing:.06em}
.wn{font-family:'Russo One';font-size:20px;line-height:1.15;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wh{font-size:12px;font-weight:800}
.winin{animation:winin .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes winin{0%{transform:scale(0) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
.seat.winner .ava{box-shadow:0 0 0 3px #ffd36b,0 0 26px 6px rgba(255,200,80,.85);animation:winglow 1.6s infinite}
@keyframes winglow{50%{box-shadow:0 0 0 4px #fff2b0,0 0 38px 12px rgba(255,200,80,.95)}}
.seat.winner .card .f{box-shadow:0 0 0 2px #ffd36b,0 0 10px #ffd36b}
.ribbon{font-size:10px;font-weight:800;background:#ffd36b;color:#2a1606;border-radius:6px;padding:1px 6px;margin-top:2px;display:inline-block;white-space:nowrap}
.seat.lostdim{opacity:.6}

/* ---------- красное-чёрное ---------- */
.rb{position:absolute;left:0;top:-2px;width:112px;z-index:6;background:rgba(14,8,16,.88);border:1px solid var(--line);border-radius:10px;padding:4px;max-height:92px;overflow-y:auto;scrollbar-width:none}
.rbh{display:grid;grid-template-columns:1fr 1fr;gap:3px;font-weight:800;text-align:center;font-size:9.5px}
.rbh .rd{color:#ff5d6c}.rbh .bk{color:#ece9f2}
.rbs{text-align:center;color:var(--muted);font-size:8.5px;margin:0 0 1px}
.rbr{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:3px}
.rbc{height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:1px;position:relative;font-weight:800;font-size:9.5px;white-space:nowrap;min-width:0}
.rbc.rd{background:rgba(214,40,58,.22)}.rbc.bk{background:rgba(255,255,255,.09)}
.rbplus{width:100%;height:100%;font-size:15px;font-weight:800;border-radius:7px;line-height:1}
.rbplus.call{animation:glowcard 1.1s infinite}
.rbplus.dim{opacity:.3}
.rbn{position:relative;max-width:34px;overflow:hidden;text-overflow:ellipsis}
.rbn.lost{opacity:.5}
.rbn.lost::after,.rbn.ko::after{content:'';position:absolute;left:0;right:0;top:52%;height:2px;background:#fff;transform-origin:left}
.rbn.ko{animation:koshake .45s both;animation-delay:inherit}
.rbn.ko::after{animation:strike .35s both;animation-delay:inherit}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes koshake{0%{transform:none}30%{transform:translateX(-4px) rotate(-6deg)}60%{transform:translateX(3px) rotate(4deg)}100%{transform:none;opacity:.5}}
.rbc.won::before,.rbc.wonpop::before{content:'👑';position:absolute;top:-10px;left:50%;margin-left:-6px;font-size:11px}
.rbc.wonpop::before{animation:pop2 .5s both;animation-delay:inherit}
@keyframes pop2{from{transform:scale(0)}to{transform:scale(1)}}
.glove{display:inline-flex;--dir:1}
.glove.l{--dir:-1}
.glove svg{width:13px;height:10px}
.glove.l svg{transform:scaleX(-1)}
.punch{animation:punch .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes punch{0%{transform:none}35%{transform:translateX(calc(var(--dir)*26px)) scale(1.7)}100%{transform:none}}
.rbx{text-align:center;font-size:8.5px;color:var(--brass);margin-top:1px}
.rbsep{text-align:center;color:var(--muted);font-size:9px;margin-top:4px;border-top:1px dashed rgba(255,255,255,.15);padding-top:2px}

/* ---------- panel ---------- */
.panel{margin:6px 8px 8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;min-height:150px;
  box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.log{font-size:12px;color:var(--muted);margin-bottom:8px;min-height:16px}
.ttl{font-family:'Russo One';font-size:19px;line-height:1.2;margin-bottom:10px}
.ttl em{font-style:normal;color:var(--brass)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:50px;border-radius:14px;font-weight:800;font-size:16px;padding:0 14px;background:rgba(255,255,255,.08)}
.btn.main{background:linear-gradient(180deg,#ff6cbc,#d93b8e);color:#fff;box-shadow:0 6px 18px rgba(255,91,176,.35)}
.btn.gold{background:linear-gradient(180deg,#f0c060,#c08a2a);color:#2a1606}
.btn.yes{background:linear-gradient(180deg,#43d98e,#1f9c5d);color:#04210f}
.btn.no{background:rgba(255,107,107,.15);color:#ffb3b3;border:1px solid rgba(255,107,107,.4)}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border-radius:999px;padding:8px 12px;font-weight:800;font-size:14px;background:rgba(255,255,255,.07);border:1px solid transparent}
.chip.on{border-color:var(--brass);color:var(--brass);background:rgba(217,164,65,.12)}
.amtin{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;margin-bottom:10px;font-weight:800}
.votes{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px;font-size:13px}
.votes span{background:rgba(255,255,255,.06);padding:4px 8px;border-radius:8px}
.stage{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 10px;--w:64px}
.stagehint{text-align:center;font-size:13px;color:var(--muted)}
.leadline{font-size:13px;margin-top:6px;text-align:center}
.leadline b{color:var(--brass)}

/* ---------- join ---------- */
.join{padding:24px 18px;display:flex;flex-direction:column;gap:16px;flex:1}
.join .neon{font-size:44px;text-align:center;margin-top:18px}
.join .sub{text-align:center;color:var(--muted);font-size:14px;margin-top:-8px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.txt{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:14px;font-weight:700}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avgrid button{aspect-ratio:1;border-radius:14px;font-size:26px;background:rgba(255,255,255,.05);border:2px solid transparent;overflow:hidden;padding:0}
.avgrid button.on{border-color:var(--neon);background:rgba(255,91,176,.12)}
.avgrid img{width:100%;height:100%;object-fit:cover}
.buyin{font-family:'Russo One';font-size:30px;color:var(--brass);text-align:center}
input[type=range]{width:100%;accent-color:var(--brass)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;top:var(--barh,0px);background:rgba(8,3,10,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px}
.ovbox{width:100%;max-width:440px;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.drawgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0;--w:46px}
.drawgrid>div{text-align:center;font-size:12px;font-weight:700;padding:6px 2px;border-radius:12px;transition:background .3s}
.drawgrid .card{margin:0 auto 4px}
.drawgrid .won{background:rgba(217,164,65,.22);box-shadow:inset 0 0 0 2px var(--brass)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin:0 0 10px;font-family:'Russo One';font-weight:400}
.sheet .btn{margin-bottom:8px;width:100%}
.arch{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.arch summary{font-weight:800;cursor:pointer;padding:4px 0}
.rules p{font-size:14px;line-height:1.5;margin:0 0 8px;color:#ddd}
table.res{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}
table.res td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
table.res td:last-child{text-align:right;font-family:'Russo One'}
.plus{color:var(--win)}.minus{color:var(--lose)}
.tr{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:6px;font-weight:700}
.tr b{font-family:'Russo One';color:var(--brass);font-weight:400}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:#fff;color:#1a0f1c;
  font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center;animation:up .2s}
.demo{font-size:11px;text-align:center;color:#ffd27a;background:rgba(255,200,80,.1);padding:4px 8px}

<script>
// ===LOGIC START===
const RANKS='23456789TJQKA', SUITS='shdc', SUIT_SYM={s:'♠',h:'♥',d:'♦',c:'♣'};
const RB_DEFAULT=10000,MAX_PER_DAY=3, DAY_MS=24*3600*1000, TURN_TIMEOUT=30000;
const rv=c=>RANKS.indexOf(c[0])+2;
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function newDeck(){const d=[];for(const r of RANKS)for(const s of SUITS)d.push(r+s);return d}
function shuffle(d){for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}

// оценка 5 карт → число (больше = сильнее)
function eval5(cs){
  const v=cs.map(rv).sort((a,b)=>b-a);
  const flush=cs.every(c=>c[1]===cs[0][1]);
  const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const g=Object.entries(cnt).map(([r,c])=>[+r,c]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const u=[...new Set(v)];
  let sh=0;
  if(u.length===5){ if(u[0]-u[4]===4) sh=u[0]; else if(u.join()==='14,5,4,3,2') sh=5; }
  let cat,tb;
  if(sh&&flush){cat=8;tb=[sh]}
  else if(g[0][1]===4){cat=7;tb=[g[0][0],g[1][0]]}
  else if(g[0][1]===3&&g[1][1]===2){cat=6;tb=[g[0][0],g[1][0]]}
  else if(flush){cat=5;tb=v}
  else if(sh){cat=4;tb=[sh]}
  else if(g[0][1]===3){cat=3;tb=g.map(x=>x[0])}
  else if(g[0][1]===2&&g[1][1]===2){cat=2;tb=g.map(x=>x[0])}
  else if(g[0][1]===2){cat=1;tb=g.map(x=>x[0])}
  else{cat=0;tb=v}
  let s=cat;for(let i=0;i<5;i++)s=s*15+(tb[i]||0);
  return s;
}
// лучшая рука из 7 карт
function eval7(cards){
  let best=-1;const n=cards.length;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const five=cards.filter((_,k)=>k!==i&&k!==j);
    const s=eval5(five); if(s>best)best=s;
  }
  return best;
}
const CAT_NAMES=['Старшая карта','Пара','Две пары','Сет','Стрит','Флеш','Фулл-хаус','Каре','Стрит-флеш'];
function handName(score){
  const cat=Math.floor(score/759375);
  if(cat===8&&Math.floor(score/50625)%15===14)return 'Роял-флеш';
  return CAT_NAMES[cat];
}

// минимум переводов: сначала точные совпадения, потом самый проигравший → самому выигравшему
function settle(list){
  const cred=list.filter(x=>x.net>0).map(x=>({name:x.name,v:x.net}));
  const deb=list.filter(x=>x.net<0).map(x=>({name:x.name,v:-x.net}));
  const out=[];
  for(const d of deb){
    const c=cred.find(c=>c.v===d.v&&c.v>0);
    if(c){out.push({from:d.name,to:c.name,amt:d.v});c.v=0;d.v=0}
  }
  const byV=(a,b)=>b.v-a.v;
  let cs=cred.filter(x=>x.v>0), ds=deb.filter(x=>x.v>0);
  while(cs.length&&ds.length){
    cs.sort(byV);ds.sort(byV);
    const c=cs[0],d=ds[0],amt=Math.min(c.v,d.v);
    out.push({from:d.name,to:c.name,amt});
    c.v-=amt;d.v-=amt;
    cs=cs.filter(x=>x.v>0);ds=ds.filter(x=>x.v>0);
  }
  return out;
}

function err(m){const e=new Error(m);e.user=true;return e}
function norm(st){
  st=st||{};
  st.players=st.players||{};st.archive=st.archive||[];st.phase=st.phase||'lobby';st.history=st.history||[];st.deals=st.deals||[];
  if(st.hand){const h=st.hand;h.leaders=h.leaders||[];h.trashed=h.trashed||{};h.revealed=h.revealed||{};h.participants=h.participants||[];h.hole=h.hole||{};h.board=h.board||[]}
  st.rb=st.rb||{};st.rb.rows=st.rb.rows||[];st.rb.stake=st.rb.stake||RB_DEFAULT;st.rbNet=st.rbNet||{};
  if(st.hand)st.hand.rb=st.hand.rb||[];
  if(st.proposal){st.proposal.votes=st.proposal.votes||{};st.proposal.voters=st.proposal.voters||[]}
  return st;
}
const seated=st=>Object.values(st.players).sort((a,b)=>a.seat-b.seat);
const order=st=>seated(st).map(p=>p.id);
function nextAfter(st,pid){
  const ps=seated(st);if(!ps.length)return null;
  const me=st.players[pid];const seat=me?me.seat:-1;
  const nx=ps.find(p=>p.seat>seat);return (nx||ps[0]).id;
}
const pname=(st,id)=>(st.players[id]&&st.players[id].name)||'игрок';
const recentDeals=(st,now=Date.now())=>st.deals.filter(t=>now-t<DAY_MS);
const leftToday=(st,now)=>(typeof window!=='undefined'&&window.NO_LIMIT)||!st.limitOn?99:MAX_PER_DAY-recentDeals(st,now).length;
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const fmtK=n=>n>=1000&&n%1000===0?(n/1000)+'к':fmt(n);
function limitMsg(st){
  const r=recentDeals(st);if(!r.length)return 'Лимит на сегодня исчерпан';
  const t=new Date(Math.min(...r)+DAY_MS);
  return `Лимит ${MAX_PER_DAY} хашламы в сутки. Следующая — после ${t.toLocaleString('ru-RU',{weekday:'short',hour:'2-digit',minute:'2-digit'})}`;
}

const A={
  join(st,me,{name,buyin,av,admin}){
    if(st.phase==='final')throw err('Вечер завершён — админ должен нажать «Новый вечер»');
    if(admin)st.admin=me;
    if(st.players[me]){Object.assign(st.players[me],{name,av});return}
    const taken=new Set(seated(st).map(p=>p.seat));let seat=-1;
    for(let i=0;i<8;i++)if(!taken.has(i)){seat=i;break}
    if(seat<0)throw err('Стол полный: 8 из 8');
    st.players[me]={id:me,name,av,buyin,stack:buyin,seat};
    st.log=`👋 ${name} садится за стол с ${fmt(buyin)}`;
  },
  leave(st,me){
    if(st.phase!=='lobby')throw err('Встать можно только до розыгрыша баттона');
    delete st.players[me];
  },
  rebuy(st,me,amt){
    const p=st.players[me];if(!p)throw err('Ты не за столом');
    if(st.phase==='final')throw err('Вечер уже подсчитан');
    if(p.buyin+amt>5000000)throw err('Слишком много докупок');
    p.buyin+=amt;p.stack+=amt;st.log=`💰 ${p.name} докупается на ${fmt(amt)}`;
  },
  drawButton(st,me){
    needAdmin(st,me);
    if(st.phase!=='lobby')throw err('Игра уже идёт');
    const ids=order(st);if(ids.length<2)throw err('Нужно минимум 2 игрока');
    const deck=shuffle(newDeck()),cards={};
    ids.forEach((id,i)=>cards[id]=deck[i]);
    const sv=c=>rv(c)*4+'cdhs'.indexOf(c[1]);
    const win=ids.reduce((a,b)=>sv(cards[b])>sv(cards[a])?b:a);
    st.draw={id:Date.now()+'-'+rnd(1e6),cards,winner:win};
    st.button=win;st.phase='propose';
    st.log=`🎲 Баттон у ${pname(st,win)}. Админ выбирает сумму`;
  },
  propose(st,me,amount){
    if(st.phase!=='propose')throw err('Сейчас не время предлагать');
    needAdmin(st,me);
    amount=Math.round(amount);
    if(!(amount>=1000))throw err('Минимум 1 000');
    if(leftToday(st)<=0)throw err(limitMsg(st));
    st.proposal={by:me,amount,voters:order(st),votes:{}};
    st.phase='vote';
  },
  cancel(st,me){
    needAdmin(st,me);if(st.phase!=='vote')return;
    st.phase='propose';st.proposal=null;
  },
  vote(st,me,yes){
    if(st.phase!=='vote')throw err('Голосование уже закончилось');
    const pr=st.proposal;
    if(!pr.voters.includes(me))throw err('Ты сел после предложения — жди следующего');
    if(yes&&st.players[me].stack<pr.amount)throw err('Не хватает фишек — докупись в меню');
    pr.votes[me]=yes?'y':'n';
    const live=pr.voters.filter(id=>st.players[id]);
    if(live.every(id=>pr.votes[id]))resolveVote(st);
  },
  dealNow(st,me){
    needAdmin(st,me);if(st.phase!=='vote')throw err('Голосование уже закончилось');
    const pr=st.proposal;
    const yes=pr.voters.filter(id=>st.players[id]&&pr.votes[id]==='y');
    if(yes.length<2)throw err('Нужен хотя бы один согласный');
    deal(st,yes);
  },
  reveal(st,me,pid,i,now=Date.now()){
    if(st.phase!=='reveal')throw err('Сейчас никто не вскрывается');
    const h=st.hand,cur=h.participants[h.idx];
    if(pid!==cur)throw err('Сейчас очередь другого игрока');
    if(me!==cur&&now-h.turnAt<TURN_TIMEOUT)throw err('Подожди, игрок вскроется сам');
    const r=h.revealed[cur];if(r[i])return;
    r[i]=1;h.turnAt=now;
    if(r[0]&&r[1])settleStep(st,now);
  },
  rbJoin(st,me,color,row){
    if(!st.players[me])throw err('Сначала сядь за стол');
    if(st.phase==='final')throw err('Вечер уже подсчитан');
    if(color!=='r'&&color!=='b')return;
    const rows=st.rb.rows;
    if(rows.some(x=>x.r===me||x.b===me))throw err('Ты уже в паре — одна пара на флоп');
    if(row>=rows.length){rows.push({r:'',b:''});row=rows.length-1}
    const x=rows[row];if(!x)throw err('Строка уже ушла');
    if(x[color])throw err('Место уже занято');
    x[color]=me;
    const o=x[color==='r'?'b':'r'];
    if(o)st.log=`🥊 ${pname(st,o)} против ${pname(st,me)}: красное-чёрное по ${fmt(st.rb.stake)}`;
  },
  rbLeave(st,me){
    const rows=st.rb.rows,i=rows.findIndex(x=>x.r===me||x.b===me);if(i<0)return;
    const x=rows[i];if(x.r&&x.b)throw err('Пара уже сложилась — ставка в силе');
    rows.splice(i,1);
  },
  toggleLimit(st,me){needAdmin(st,me);st.limitOn=!st.limitOn;st.log=st.limitOn?'🛑 Включён лимит: 3 хашламы в сутки':'♾️ Лимит хашлам выключен'},rbStake(st,me,v){needAdmin(st,me);st.rb.stake=v;st.log=`🎯 Красное-чёрное теперь по ${fmt(v)}`},
  next(st,me){
    needAdmin(st,me);
    if(st.phase!=='result')throw err('Хашлама ещё идёт');
    if(leftToday(st)<=0)throw err(limitMsg(st));
    st.phase='propose';st.proposal=null;st.hand=null;
    st.log=`🍲 Новая хашлама. Админ выбирает сумму`;
  },
  finish(st,me){
    needAdmin(st,me);
    if(st.phase==='reveal'||st.phase==='vote')throw err('Сначала доиграйте текущую хашламу');
    st.phase='final';st.proposal=null;
  },
  resume(st,me){
    needAdmin(st,me);
    if(st.phase!=='final')return;
    if(!st.button){st.phase='lobby';return}
    if(leftToday(st)<=0)throw err(limitMsg(st));
    st.phase='propose';st.hand=null;
  },
  newEvening(st,me){
    needAdmin(st,me);
    if(st.phase!=='final')throw err('Сначала подведите итоги');
    const now=Date.now(),rows=seated(st).map(p=>({name:p.name,net:p.stack-p.buyin,rb:st.rbNet[p.id]||0}));
    let archive=st.archive.filter(e=>now-e.at<7*DAY_MS);
    if(st.history.length||rows.some(r=>r.rb))archive=[...archive,{at:now,hands:st.history.length,rows}];
    const deals=st.deals,admin=st.admin,stake=st.rb.stake;
    for(const k of Object.keys(st))delete st[k];
    Object.assign(st,norm({deals,admin,archive,rb:{rows:[],stake},phase:'lobby',log:'✨ Новый вечер. Садитесь за стол'}));
  }
};
function needAdmin(st,me){if(!st.admin||st.admin!==me)throw err('Это может сделать только админ')}
function resolveVote(st){
  const pr=st.proposal;
  const yes=pr.voters.filter(id=>st.players[id]&&pr.votes[id]==='y');
  if(yes.length>=2)return deal(st,yes);
  st.log=`🙅 Дорого! Хашлама по ${fmt(pr.amount)} не собралась (нужно минимум двое). Админ предлагает другую сумму`;
  st.proposal=null;st.phase='propose';
}
function deal(st,yes){
  if(leftToday(st)<=0)throw err(limitMsg(st));
  const ids=order(st),bi=ids.indexOf(st.button);
  const rot=bi<0?ids:[...ids.slice(bi+1),...ids.slice(0,bi+1)];   // от малого блайнда к баттону
  const parts=rot.filter(id=>yes.includes(id));
  const amt=st.proposal.amount;
  for(const id of parts)if(st.players[id].stack<amt)throw err(`${pname(st,id)}: не хватает фишек`);
  const deck=shuffle(newDeck()),hole={},revealed={};
  parts.forEach(id=>{hole[id]=[deck.pop(),deck.pop()];revealed[id]=[0,0]});
  const board=[deck.pop(),deck.pop(),deck.pop(),deck.pop(),deck.pop()];
  parts.forEach(id=>st.players[id].stack-=amt);
  const now=Date.now();
  st.deals=[...recentDeals(st,now),now];
  st.handNo=(st.handNo||0)+1;
  const rb=resolveRB(st,board);
  st.hand={no:st.handNo,participants:parts,hole,revealed,board,idx:0,leaders:[],trashed:{},pot:amt*parts.length,amount:amt,turnAt:now,rb};
  st.phase='reveal';st.proposal=null;
  st.log=`🃏 Хашлама №${st.handNo} по ${fmt(amt)}, в котле ${fmt(amt*parts.length)}`+(rb.length?` · 🥊 пар в красное-чёрное: ${rb.length}`:'');
}
// красное-чёрное: решает флоп. 2 из 3 — ×1, все три одного цвета — ×2, все три одной масти — ×3
function rbOutcome(flop){
  const reds=flop.filter(c=>c[1]==='h'||c[1]==='d').length;
  const win=reds>=2?'r':'b',cnt=win==='r'?reds:3-reds;
  const mult=cnt===3?(flop.every(c=>c[1]===flop[0][1])?3:2):1;
  return{win,mult};
}
function resolveRB(st,board){
  const {win,mult}=rbOutcome(board.slice(0,3)),out=[];
  for(const x of st.rb.rows){
    if(!(x.r&&x.b))continue;               // пара не сложилась до раздачи — не играет
    const amt=st.rb.stake*mult,w=x[win],l=x[win==='r'?'b':'r'];
    st.rbNet[w]=(st.rbNet[w]||0)+amt;st.rbNet[l]=(st.rbNet[l]||0)-amt;
    out.push({r:x.r,b:x.b,win,mult,amt});
  }
  st.rb.rows=st.rb.rows.filter(x=>!(x.r&&x.b));   // недособранные пары ждут следующего флопа
  return out;
}
function settleStep(st,now){
  const h=st.hand,cur=h.participants[h.idx];
  const sc=eval7([...h.hole[cur],...h.board]);
  if(!h.leaders.length)h.leaders=[cur];
  else{
    const best=eval7([...h.hole[h.leaders[0]],...h.board]);
    if(sc>best){h.leaders.forEach(id=>h.trashed[id]=1);h.leaders=[cur]}
    else if(sc===best)h.leaders.push(cur);
    else h.trashed[cur]=1;
  }
  h.idx++;h.turnAt=now;
  if(h.idx>=h.participants.length)finishHand(st);
}
function finishHand(st){
  const h=st.hand,w=h.leaders;
  const share=Math.floor(h.pot/w.length),rem=h.pot-share*w.length;
  w.forEach((id,k)=>{if(st.players[id])st.players[id].stack+=share+(k===0?rem:0)});
  const name=handName(eval7([...h.hole[w[0]],...h.board]));
  h.result={winners:w,share,name};
  st.history=[...st.history,{no:h.no,amount:h.amount,pot:h.pot,winners:w.map(id=>pname(st,id)),hand:name}];
  st.log=`🏆 ${w.map(id=>pname(st,id)).join(' и ')} забирает ${fmt(h.pot)} — ${name}`;
  st.button=nextAfter(st,st.button);
  st.phase='result';
}
// ===LOGIC END===
</script>

<script>
/* ===================== ХРАНИЛИЩЕ ===================== */
const CFG=window.FIREBASE_CONFIG||{};
const ONLINE=!!(CFG.apiKey&&CFG.databaseURL&&typeof firebase!=='undefined');
window.NO_LIMIT=!ONLINE;   // в демо лимит 3 хашламы не действует
const clean=o=>JSON.parse(JSON.stringify(o));
let Store;
if(ONLINE){
  firebase.initializeApp(CFG);
  const db=firebase.database(),ref=db.ref('hashlama/state'),avRef=db.ref('hashlama/avatars');
  Store={
    sub(cb){ref.on('value',s=>cb(s.val()))},
    subAv(cb){avRef.on('value',s=>cb(s.val()||{}))},
    setAv(id,data){return avRef.child(id).set(data)},
    tx(fn){return new Promise((res,rej)=>{let e=null;
      ref.transaction(cur=>{e=null;try{return fn(cur)}catch(x){e=x;return}},
        (fe,ok)=>{if(e)rej(e);else if(fe)rej(fe);else res(ok)},false)})}
  };
}else{
  const K='hashlama_demo_state',KA='hashlama_demo_av';
  const bc='BroadcastChannel' in window?new BroadcastChannel('hashlama'):null;
  const subs=[],asubs=[];
  const mem={};
  const read=k=>{try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(_){}return mem[k]?JSON.parse(mem[k]):null};
  const write=(k,v)=>{mem[k]=JSON.stringify(v);try{localStorage.setItem(k,mem[k])}catch(_){}};
  const emit=()=>{subs.forEach(f=>f(read(K)));asubs.forEach(f=>f(read(KA)||{}))};
  if(bc)bc.onmessage=emit; window.addEventListener('storage',emit);
  Store={
    sub(cb){subs.push(cb);cb(read(K))},
    subAv(cb){asubs.push(cb);cb(read(KA)||{})},
    setAv(id,data){const a=read(KA)||{};a[id]=data;write(KA,a);bc&&bc.postMessage(1);emit();return Promise.resolve()},
    tx(fn){try{const nx=fn(read(K));if(nx!==undefined){write(K,nx);bc&&bc.postMessage(1);emit()}return Promise.resolve()}catch(e){return Promise.reject(e)}}
  };
}
function getPid(){
  const st=ONLINE?localStorage:sessionStorage;   // в демо каждая вкладка — отдельный игрок
  let id=null;try{id=st.getItem('hashlama_pid')}catch(_){}
  if(!id){id='p'+Date.now().toString(36)+rnd(1e9).toString(36);try{st.setItem('hashlama_pid',id)}catch(_){}}
  return id;
}
let ME=getPid();
const ADMIN_CODE=String(window.ADMIN_CODE||'');
(function(){const store=ONLINE?localStorage:sessionStorage;
  const q=new URLSearchParams(location.search);
  if(ADMIN_CODE&&q.get('admin')===ADMIN_CODE){try{store.setItem('hashlama_admin',ADMIN_CODE)}catch(_){}
    q.delete('admin');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash)}
})();
function adminDevice(){if(!ONLINE&&!S.admin)return true;try{return !!ADMIN_CODE&&(ONLINE?localStorage:sessionStorage).getItem('hashlama_admin')===ADMIN_CODE}catch(_){return false}}
const isAdmin=()=>S.admin===ME;
function act(name,...args){
  return Store.tx(cur=>{const st=norm(cur?clean(cur):{});A[name](st,ME,...args);return clean(st)})
    .catch(e=>toast(e.user?e.message:'Ошибка связи, попробуй ещё раз'));
}

/* ===================== АНИМАЦИИ ===================== */
const anims={};
function trig(key,cls,dur,delay=0){anims[key]={start:performance.now()+delay,dur,cls}}
function an(key){
  const a=anims[key];if(!a)return{c:'',s:''};
  const now=performance.now();
  if(now>a.start+a.dur+200){delete anims[key];return{c:'',s:''}}

function coins(ids){
  const src=document.querySelector('#tbl .winban')||document.querySelector('#tbl .pot');if(!src)return;
  const pr=src.getBoundingClientRect(),cx=pr.left+pr.width/2,cy=pr.top+pr.height/2;
  ids.forEach((id,w)=>{

    const sr=s.getBoundingClientRect(),dx=sr.left+sr.width/2-cx,dy=sr.top+sr.height/2-cy;

      c.style.cssText=`position:fixed;left:${cx-11}px;top:${cy-11}px;font-size:22px;z-index:85;pointer-events:none`;
      document.body.appendChild(c);
      const a=c.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{opacity:1,offset:.12},

        {transform:`translate(${dx}px,${dy}px) scale(.45)`,opacity:.3}],{duration:1050,delay:k*75+w*120,easing:'ease-in-out',fill:'both'});

}

function detect(p,n){
  if(!p)return;   // первый снимок — без эффектов
  const h=n.hand,ph=p.hand;
  if(n.draw&&(!p.draw||p.draw.id!==n.draw.id))showDraw(n.draw);
  if(h&&(!ph||ph.no!==h.no)){
    h.board.forEach((_,i)=>trig(`board:${h.no}:${i}`,'flip',750,i<3?250+i*140:i===3?1000:1500));
    h.participants.forEach((id,k)=>[0,1].forEach(i=>trig(`deal:${h.no}:${id}:${i}`,'dealin',450,k*90+i*40)));
    h.rb.forEach((_,i)=>{trig(`rbp:${h.no}:${i}`,'punch',700,1500+i*300);trig(`rbk:${h.no}:${i}`,'x',500,1780+i*300)});
    if(h.rb.length){const o=rbOutcome(h.board.slice(0,3));
      setTimeout(()=>toast(`${o.win==='r'?'🔴 Красное':'⚫ Чёрное'}${o.mult>1?` ×${o.mult}`:''}! ${h.rb.map(r=>pname(n,r[r.win])).join(', ')} +${fmtK(h.rb[0].amt)}`),1700)}
  }
  if(h&&ph&&ph.no===h.no){
    for(const id of h.participants){
      [0,1].forEach(i=>{if(h.revealed[id][i]&&!(ph.revealed[id]||[])[i])trig(`flip:${h.no}:${id}:${i}`,'flip',750)});
      if(h.trashed[id]&&!ph.trashed[id]){trig(`trash:${h.no}:${id}`,'trashfly',1100,900);trig('trashbin','shake',600,1500)}
    }
    if(h.idx>ph.idx&&n.phase==='reveal'){stageHold={no:h.no,pid:h.participants[ph.idx],until:performance.now()+2400};
      setTimeout(()=>{lastPanel='';render()},2500)}
    const nl=h.leaders.find(id=>!ph.leaders.includes(id));
    if(nl&&ph.leaders.length){trig(`lead:${nl}`,'pop',900,300);
      setTimeout(()=>toast(`🔥 ${pname(n,nl)} перебивает: ${handName(eval7([...h.hole[nl],...h.board]))}`),500)}
  }
  if(n.phase==='result'&&p.phase!=='result'&&n.hand&&n.hand.result){
    const w=n.hand.result.winners;
    trig('winban','winin',900,900);w.forEach(id=>trig(`lead:${id}`,'pop',900,1100));
    setTimeout(()=>coins(w),1250);setTimeout(confetti,1500);
  }
}

function tableHTML(){
  const me=S.players[ME],h=S.hand,ps=seated(S);
  const rot=me?me.seat:0;
  let html='<div class="felt"></div>';
  // котёл
  let pot='',lbl='';
  if(h){pot=fmt(h.pot);lbl='в котле'}
  else if(S.phase==='vote'){pot=fmt(S.proposal.amount);lbl='с каждого'}
  const res=S.phase==='result'&&h&&h.result;
  if(res){
    const wa=an('winban');
    html+=`<div class="winban"><div class="wb ${wa.c}" style="${wa.s}"><div class="wt">🏆 ПОБЕДА</div><div class="wn">${res.winners.map(id=>esc(pname(S,id))).join(' и ')}</div><div class="wh">${res.name} · +${fmt(res.winners.length>1?res.share:h.pot)}</div></div></div>`;
  }else html+=`<div class="pot"><div class="steam"><i></i><i></i><i></i></div><div class="kazan">🍲</div>${pot?`<div class="potamt">${pot}</div><div class="potlbl">${lbl}</div>`:''}</div>`;
  html+=rbHTML();
  // борд
  if(h)html+=`<div class="board">${h.board.map((c,i)=>cardHTML(c,{key:`board:${h.no}:${i}`})).join('')}</div>`;
  const tc=h?Object.keys(h.trashed).length:0;const tb=an('trashbin');
  html+=`<div class="trash ${tb.c}" style="${tb.s}">🗑️${tc?`<b>${tc}</b>`:''}</div>`;
  // пустые места
  const taken=new Set(ps.map(p=>p.seat));
  for(let s=0;s<8;s++)if(!taken.has(s)){const [x,y]=SEATPOS[(s-rot+8)%8];html+=`<div class="empty" style="left:${x}%;top:${y}%"></div>`}
  for(const p of ps){
    const vi=(p.seat-rot+8)%8,[x,y]=SEATPOS[vi];
    const inHand=h&&h.participants.includes(p.id);
    const cur=h&&S.phase==='reveal'&&h.participants[h.idx]===p.id;
    const leader=h&&h.leaders.includes(p.id);
    const trashed=h&&h.trashed[p.id];
    const dwin=drawShown&&performance.now()>=drawShown.winAt&&drawShown.d.winner===p.id;
    const isWin=res&&res.winners.includes(p.id);
    const cls=['seat',p.id===ME?'me':'',cur?'turn':'',leader||dwin?'leader':'',(h&&!inHand)?'idle':'',isWin?'winner':'',(res&&inHand&&!isWin)?'lostdim':''].join(' ');
    let cards='';
    if(inHand){
      const r=h.revealed[p.id];
      const ta=an(`trash:${h.no}:${p.id}`);
      if(!trashed||ta.c){
        cards=[0,1].map(i=>{
          const k=r[i]?`flip:${h.no}:${p.id}:${i}`:`deal:${h.no}:${p.id}:${i}`;
          return cardHTML(h.hole[p.id][i],{down:!r[i],key:k});
        }).join('');
        if(ta.c)cards=`<div class="${ta.c}" style="display:flex;gap:2px;${ta.s}">${cards}</div>`;
      }
    }
    if(drawShown&&drawShown.d.cards[p.id]&&!inHand){
      const won=performance.now()>=drawShown.winAt&&drawShown.d.winner===p.id;
      cards=`<div style="--w:30px;display:flex;margin-top:-8px">${cardHTML(drawShown.d.cards[p.id],{key:`draw:${drawShown.d.id}:${p.id}`,extra:won?'tap':''})}</div>`;
    }
    let tag='';
    if(inHand&&h.revealed[p.id][0]&&h.revealed[p.id][1]&&!trashed)tag=`<div class="handtag">${handName(eval7([...h.hole[p.id],...h.board]))}</div>`;
    if(trashed&&!an(`trash:${h.no}:${p.id}`).c)tag='<div class="handtag">🗑️ в мусорке</div>';
    let badge='';
    if(S.phase==='vote'&&S.proposal.voters.includes(p.id)){const v=S.proposal.votes[p.id];badge=`<div class="badge">${v==='y'?'✅':v==='n'?'❌':'⏳'}</div>`}

    html+=`<div class="${cls}" data-seat="${p.id}" style="left:${x}%;top:${y}%">${leader?'<div class="crown">👑</div>':''}${bubble}${badge}

    if(v)return h+`<p class="muted">${v==='y'?'Ты в деле ✅':'Ты пасуешь ❌'} Ждём остальных…</p>`+adm;
    if(me.stack<pr.amount)return h+`<p class="muted">Не хватает фишек (у тебя ${fmt(me.stack)}). Докупись в меню ☰ или откажись.</p><div class="row"><button class="btn no" data-a="vote" data-v="0">❌ Пас</button><button class="btn gold" data-a="menu">💰 Докупиться</button></div>`+adm;
    return h+`<div class="row"><button class="btn no" data-a="vote" data-v="0">❌ Дорого</button><button class="btn yes" data-a="vote" data-v="1">✅ Согласен</button></div>`+adm;
  }
  if(ph==='reveal'){
    const hd=S.hand;
    if(false){
      const pid=stageHold.pid,nm=handName(eval7([...hd.hole[pid],...hd.board]));
      return h+`<div class="ttl">${esc(pname(S,pid))} вскрылся</div>
        <div class="stage">${[0,1].map(i=>cardHTML(hd.hole[pid][i],{key:`flip:${hd.no}:${pid}:${i}`})).join('')}</div>
        <div class="leadline">${nm} — ${hd.trashed[pid]?'🗑️ в мусорку':'👑 лидирует'}</div>`;
    }
    const cur=hd.participants[hd.idx],cp=S.players[cur],r=hd.revealed[cur];
    const mine=cur===ME,timeout=Date.now()-hd.turnAt>=TURN_TIMEOUT;
    clearTimeout(turnTimer);
    if(!mine&&!timeout)turnTimer=setTimeout(()=>{lastPanel='';render()},TURN_TIMEOUT-(Date.now()-hd.turnAt)+50);
    const canTap=mine||timeout;
    h+=`<div class="ttl">${mine?'Твоя очередь вскрываться':`Вскрывается ${esc(cp?cp.name:'')}`} <span class="muted">${hd.idx+1} из ${hd.participants.length}</span></div>
      <div class="stage">${myStage(hd,cur,canTap)}</div>`;
        
    if(mine)h+='<div class="stagehint">Тапай по карте — открывай по одной, не спеши 😏</div>';
    else if(timeout)h+='<div class="stagehint">Игрок молчит больше 30 секунд — можно вскрыть за него</div>';
    if(hd.leaders.length){
      const nm=handName(eval7([...hd.hole[hd.leaders[0]],...hd.board]));
      h+=`<div class="leadline">Сейчас лидирует <b>${hd.leaders.map(id=>esc(pname(S,id))).join(' и ')}</b>: ${nm}</div>`;
    }
    return h;
  }
  if(ph==='result'){
    const res=S.hand&&S.hand.result;
    h=`<div class="log"></div><div class="ttl">🏆 Победил${res&&res.winners.length>1?'и':''} ${res?res.winners.map(id=>esc(pname(S,id))).join(' и '):''}! Котёл <em>${S.hand?fmt(S.hand.pot):''}</em></div>
      <p class="muted">${res?res.name:''}${res&&res.winners.length>1?` — делят поровну, по ${fmt(res.share)}`:''}</p>`;
    if(left>0)h+=(window.NO_LIMIT||!S.limitOn?'':`<p class="muted">Осталось хашлам на сегодня: ${left}</p>`)+(isAdmin()?`<div class="row"><button class="btn" data-a="finish">Итоги</button><button class="btn main" data-a="next">🍲 Ещё хашлама</button></div>`:'<p class="muted">Ждём решения админа: ещё хашлама или итоги.</p>');
    else h+=`<p class="muted">Это была последняя хашлама на сегодня 🛑</p>`+(isAdmin()?`<div class="row"><button class="btn gold" data-a="finish">Подвести итоги</button></div>`:'<p class="muted">Админ подведёт итоги.</p>');
    return h;
  }
  return h;
}
function myStage(hd,cur,canTap){const mine=cur===ME;let x='';if(hd.hole[ME]){const r=hd.revealed[ME];x=[0,1].map(i=>r[i]?cardHTML(hd.hole[ME][i],{key:`flip:${hd.no}:${ME}:${i}`}):cardHTML(null,{extra:mine?'tap':'',attrs:mine?`data-a="rev" data-p="${ME}" data-i="${i}"`:''})).join('');if(hd.trashed[ME])x=`<div style="opacity:.45;display:flex;gap:12px">${x}</div>`}else x='<div class="muted">Ты не в этой раздаче — смотри на стол</div>';if(!mine&&canTap){const i=hd.revealed[cur][0]?1:0;x+=`<button class="btn" style="flex:none" data-a="rev" data-p="${cur}" data-i="${i}">Вскрыть за ${esc(pname(S,cur))}</button>`}return x}function restoreDraft(){
  const i=document.getElementById('amt');if(!i)return;
  if(amountDraft)i.value=amountDraft;
  i.oninput=()=>{amountDraft=i.value;markChips()};markChips();
}
function markChips(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',String(c.dataset.v)===String(amountDraft)))}

/* ---------- вход ---------- */
function renderJoin(app){
  const full=seated(S).length>=8;
  app.innerHTML=`
  <div class="join">
    <div class="neon">Хашлама</div>
    <div class="sub">${S.phase==='final'?'Вечер уже подсчитан — дождитесь «Нового вечера»':full?'Стол полный: 8 из 8':`За столом ${seated(S).length} из 8`}</div>
    <div class="field"><label for="nm">Ник за столом</label><input class="txt" id="nm" maxlength="14" placeholder="Например, Анвар" autocomplete="off"></div>
    <div class="field"><label>Аватарка</label><div class="avgrid" id="avg"></div></div>
    <div class="field"><label for="bi">Бай-ин</label><div class="buyin" id="biv"></div>
      <input type="range" id="bi" min="10000" max="500000" step="10000"></div>
    ${adminDevice()?'<p class="muted" style="text-align:center;margin:0">⭐ Ты входишь как админ</p>':''}
    <button class="btn main" data-a="join" ${full?'disabled':''}>Сесть за стол</button>
  </div>`;
  const nm=document.getElementById('nm');nm.value=joinDraft.name;nm.oninput=()=>joinDraft.name=nm.value;
  const bi=document.getElementById('bi');bi.value=joinDraft.buyin;
  const upd=()=>{joinDraft.buyin=+bi.value;document.getElementById('biv').textContent=fmt(joinDraft.buyin)};bi.oninput=upd;upd();
  drawAvGrid();
}
function drawAvGrid(){
  const g=document.getElementById('avg');if(!g)return;
  g.innerHTML=AV_LIST.map(e=>`<button class="${joinDraft.av===e?'on':''}" data-a="pickAv" data-v="${e}">${e}</button>`).join('')
    +`<button class="${joinDraft.av==='photo'?'on':''}" data-a="photo">${joinDraft.photo?`<img src="${joinDraft.photo}" alt="">`:'📷'}</button>`;
}
function loadPhoto(file){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
    const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);
    joinDraft.photo=c.toDataURL('image/jpeg',.75);joinDraft.av='photo';drawAvGrid();
  };img.src=fr.result};
  fr.readAsDataURL(file);
}
document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(f)loadPhoto(f);e.target.value=''};

/* ---------- оверлеи ---------- */
let drawShown=null,drawTimer;
function showDraw(d){
  clearTimeout(drawTimer);
  const ids=order(S).filter(id=>d.cards[id]);
  const STEP=550,winIn=500+ids.length*STEP+700,now=performance.now();
  drawShown={d,winAt:now+winIn};
  ids.forEach((id,k)=>trig(`draw:${d.id}:${id}`,'flip',750,500+k*STEP));
  trig(`lead:${d.winner}`,'pop',900,winIn);
  setTimeout(()=>{lastPanel='';render()},winIn+20);
  drawTimer=setTimeout(()=>{drawShown=null;lastPanel='';render()},winIn+2600);
}
function renderOverlay(){
  const o=document.getElementById('ovl');let h='';
  if(S.phase==='final')h=finalHTML();
  else if(false){
    const d=drawShown.d;
    h=`<div class="ov" data-a="closeDraw"><div class="ovbox"><div class="ttl" style="text-align:center">Разыгрываем баттон</div>
      <p class="muted" style="text-align:center;margin:0">Старшая карта забирает баттон</p>
      <div class="drawgrid">${Object.keys(d.cards).filter(id=>S.players[id]).map(id=>`<div data-dw="${id}">${cardHTML(d.cards[id],{key:`draw:${d.id}:${id}`})}${esc(pname(S,id))}</div>`).join('')}</div>
      <p class="muted" style="text-align:center">Баттон: <b style="color:var(--brass)">${esc(pname(S,d.winner))}</b> · тапни, чтобы закрыть</p></div></div>`;
  }
  if(sheet)h+=sheetHTML();
  if(o.dataset.h!==h){o.innerHTML=h;o.dataset.h=h}
}
function trList(tr,empty){return tr.length?tr.map(t=>`<div class="tr"><span>${esc(t.from)} → ${esc(t.to)}</span><b>${fmt(t.amt)}</b></div>`).join(''):`<p class="muted">${empty}</p>`}
function ledgerBlock(rows){
  const hasRb=rows.some(r=>r.rb);
  rows=[...rows].sort((a,b)=>b.net-a.net);
  let x=`<table class="res"><tr><td class="muted">Игрок</td><td class="muted" style="font-family:Manrope;text-align:right">Хашлама</td>${hasRb?'<td class="muted" style="font-family:Manrope">К/Ч</td>':''}</tr>
    ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td style="text-align:right;font-family:'Russo One'">${sign(r.net)}</td>${hasRb?`<td>${sign(r.rb)}</td>`:''}</tr>`).join('')}</table>`;
  x+=`<p class="muted" style="margin:0 0 6px">🍲 Хашлама: кто кому</p>`+trList(settle(rows.map(r=>({name:r.name,net:r.net}))),'Все при своих 🤝');
  if(hasRb)x+=`<p class="muted" style="margin:10px 0 6px">🥊 Красное-чёрное: кто кому</p>`+trList(settle(rows.map(r=>({name:r.name,net:r.rb}))),'Все при своих');
  return x;
}
function ledgerHTML(){
  const live=seated(S).map(p=>({name:p.name,net:p.stack-p.buyin,rb:S.rbNet[p.id]||0}));
  const dfmt=t=>new Date(t).toLocaleString('ru-RU',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const arch=S.archive.filter(e=>Date.now()-e.at<7*DAY_MS).sort((a,b)=>b.at-a.at);
  let x=`<div class="ov" data-a="closeSheet"></div><div class="sheet" style="max-height:85dvh;overflow:auto"><h3>💸 Расчёты</h3>
    <div class="ttl" style="font-size:16px">Сейчас <span class="muted">· сыграно хашлам: ${S.history.length}</span></div>`;
  x+=live.length?ledgerBlock(live):'<p class="muted">За столом пока никого.</p>';
  x+=`<div class="ttl" style="font-size:16px;margin-top:16px">Прошлые вечера, 7 дней</div>`;
  if(!arch.length)x+='<p class="muted">Пока пусто. Вечер попадает сюда, когда админ жмёт «Новый вечер».</p>';
  arch.forEach((e,i)=>{x+=`<details class="arch" ${i===0?'open':''}><summary>${dfmt(e.at)} <span class="muted">· хашлам: ${e.hands}</span></summary>${ledgerBlock(e.rows)}</details>`});
  return x+`<button class="btn" data-a="closeSheet" style="margin-top:10px">Закрыть</button></div>`;
}
function sheetHTML(){
  if(sheet==='ledger')return ledgerHTML();
  if(sheet==='rules')return `<div class="ov" data-a="closeSheet"></div><div class="sheet rules"><h3>Как играется хашлама</h3>
    <p>1. Садятся все желающие — хоть двое. Админ (⭐) жмёт «Старт», разыгрывается баттон: у кого старшая карта — тот на баттоне.</p>
    <p>2. Админ называет цену. Каждый жмёт «Согласен» или «Дорого». Раздача идёт только на согласных, нужно минимум двое. Не собрались — админ предлагает другую сумму.</p>
    <p>3. Каждому по две карты, сразу открываются флоп, тёрн и ривер.</p>
    <p>4. Вскрываемся строго по очереди: от малого блайнда к баттону. Свои карты открываешь сам, по одной. Кто слабее текущего лидера — летит в мусорку.</p>
    <p>5. Котёл забирает сильнейшая рука, при равенстве делят. Максимум ${MAX_PER_DAY} хашламы за 24 часа.</p>
    <p>🥊 Красное-чёрное: в углу стола жмёшь «+» под цветом, кто-то принимает вызов «+» под другим. Решает флоп ближайшей раздачи: больше красных — выиграли красные, больше чёрных — чёрные. Три одного цвета — ×2, три одной масти — ×3. Пара не сложилась до раздачи — не играет. Считается отдельно от хашламы.</p>
    <button class="btn" data-a="closeSheet">Понятно</button></div>`;
  const me=S.players[ME];const busy=S.phase==='reveal'||S.phase==='vote';
  return `<div class="ov" data-a="closeSheet"></div><div class="sheet"><h3>${me?esc(me.name):''}</h3>
    <p class="muted" style="margin:0 0 10px">Бай-ин ${me?fmt(me.buyin):0}, на руках ${me?fmt(me.stack):0}${S.rbNet[ME]?`, красное-чёрное ${S.rbNet[ME]>0?'+':''}${fmt(S.rbNet[ME])}`:''}</p>
    <div class="chips">${[50000,100000,250000,500000].map(v=>`<button class="chip" data-a="rebuy" data-v="${v}">+${fmtK(v)}</button>`).join('')}</div>
    ${isAdmin()?`<p class="muted" style="margin:4px 0 6px">Ставка в красное-чёрное</p><div class="chips">${[5000,10000,25000,50000,100000].map(v=>`<button class="chip ${S.rb.stake===v?'on':''}" data-a="rbStake" data-v="${v}">${fmtK(v)}</button>`).join('')}</div>`:''}
    ${isAdmin()?`<button class="btn" data-a="toggleLimit">${S.limitOn?'♾️ Выключить лимит 3 в сутки':'🛑 Включить лимит 3 в сутки'}</button>`:''}<button class="btn" data-a="ledger">💸 Расчёты и долги</button>
    <button class="btn" data-a="rules">📖 Правила</button>
    ${busy||!isAdmin()?'':'<button class="btn gold" data-a="finish">📊 Подвести итоги вечера</button>'}
    ${S.phase==='lobby'?'<button class="btn no" data-a="leave">Встать из-за стола</button>':''}
    <button class="btn" data-a="closeSheet">Закрыть</button></div>`;
}
function finalData(){
  const rows=seated(S).map(p=>({name:p.name,p,net:p.stack-p.buyin,rb:S.rbNet[p.id]||0})).sort((a,b)=>b.net-a.net);
  const hasRb=rows.some(r=>r.rb!==0);
  return{rows,tr:settle(rows),hasRb,trRb:settle(rows.map(r=>({name:r.name,net:r.rb})))};
}
const sign=n=>`<span class="${n>0?'plus':n<0?'minus':''}">${n>0?'+':''}${fmt(n)}</span>`;
function finalHTML(){
  const {rows,tr,hasRb,trRb}=finalData();const left=leftToday(S);
  return `<div class="ov"><div class="ovbox"><div class="neon" style="font-size:30px;text-align:center">Итоги вечера</div>
    <p class="muted" style="text-align:center">Сыграно хашлам: ${S.history.length}</p>
    <table class="res"><tr><td></td><td class="muted">Игрок</td><td class="muted" style="font-family:Manrope;text-align:right">Хашлама</td>${hasRb?'<td class="muted" style="font-family:Manrope">К/Ч</td>':''}</tr>
      ${rows.map(r=>`<tr><td style="width:30px;font-size:20px">${r.p.av==='photo'?'📷':esc(r.p.av||'🙂')}</td><td><b>${esc(r.name)}</b><br><span class="muted">бай-ин ${fmt(r.p.buyin)}</span></td>
      <td style="text-align:right;font-family:'Russo One'">${sign(r.net)}</td>${hasRb?`<td>${sign(r.rb)}</td>`:''}</tr>`).join('')}</table>
    <div class="ttl" style="font-size:16px">🍲 Хашлама: кто кому переводит</div>
    ${tr.length?tr.map(t=>`<div class="tr"><span>${esc(t.from)} → ${esc(t.to)}</span><b>${fmt(t.amt)}</b></div>`).join(''):'<p class="muted">Все при своих 🤝</p>'}
    ${hasRb?`<div class="ttl" style="font-size:16px;margin-top:12px">🥊 Красное-чёрное: кто кому</div>
    ${trRb.map(t=>`<div class="tr"><span>${esc(t.from)} → ${esc(t.to)}</span><b>${fmt(t.amt)}</b></div>`).join('')}`:''}
    <div class="row" style="margin-top:12px"><button class="btn yes" data-a="share">Отправить в WhatsApp</button></div>
    ${isAdmin()?`<div class="row" style="margin-top:8px">${left>0&&S.button?'<button class="btn" data-a="resume">Вернуться к столу</button>':''}<button class="btn main" data-a="newEvening">${armedKey==='newEvening'?'Точно? Жми ещё раз':'Новый вечер'}</button></div>`:''}
    </div></div>`;
}
function shareText(){
  const {rows,tr,hasRb,trRb}=finalData();
  let t='🍲 Хашлама — итоги вечера\n\n'+rows.map(r=>`${r.name}: ${r.net>0?'+':''}${fmt(r.net)}`).join('\n');
  t+='\n\n💸 Переводы:\n'+(tr.length?tr.map(x=>`${x.from} → ${x.to}: ${fmt(x.amt)}`).join('\n'):'все при своих');
  if(hasRb){t+='\n\n🥊 Красное-чёрное:\n'+rows.filter(r=>r.rb).map(r=>`${r.name}: ${r.rb>0?'+':''}${fmt(r.rb)}`).join('\n');
    t+='\n\n💸 Переводы К/Ч:\n'+trRb.map(x=>`${x.from} → ${x.to}: ${fmt(x.amt)}`).join('\n')}
  return t;
}

/* подтверждение двойным тапом (confirm() в некоторых браузерах заблокирован) */
function armed(key){
  if(armedKey===key){armedKey=null;return true}
  armedKey=key;setTimeout(()=>{if(armedKey===key){armedKey=null;render()}},4000);render();return false;
}
/* ===================== КЛИКИ ===================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'pickAv':joinDraft.av=v;drawAvGrid();break;
    case 'photo':document.getElementById('photo').click();break;
    case 'join':{
      const name=(joinDraft.name||'').trim();
      if(!name)return toast('Придумай ник');
      if(Object.values(S.players).some(p=>p.id!==ME&&p.name.toLowerCase()===name.toLowerCase()))return toast('Такой ник уже за столом');
      if(joinDraft.av==='photo'&&joinDraft.photo)Store.setAv(ME,joinDraft.photo);
      act('join',{name,buyin:joinDraft.buyin,admin:adminDevice(),av:joinDraft.av==='photo'&&!joinDraft.photo?'🙂':joinDraft.av});break}
    case 'draw':act('drawButton');break;
    case 'preset':amountDraft=v;{const i=document.getElementById('amt');if(i)i.value=v}markChips();break;
    case 'propose':{const i=document.getElementById('amt');const n=parseInt(i&&i.value,10);
      if(!n)return toast('Выбери или впиши сумму');act('propose',n).then(()=>{amountDraft=null});break}
    case 'vote':act('vote',v==='1');break;
    case 'cancel':act('cancel');break;
    case 'dealNow':act('dealNow');break;
    case 'rev':act('reveal',t.dataset.p,+t.dataset.i);break;
    case 'next':act('next');break;
    case 'finish':sheet=null;act('finish');break;
    case 'resume':act('resume');break;
    case 'newEvening':if(armed('newEvening'))act('newEvening');break;
    case 'share':window.open('https://wa.me/?text='+encodeURIComponent(shareText()),'_blank');break;
    case 'menu':sheet='menu';renderOverlay();break;
    case 'rules':sheet='rules';renderOverlay();break;
    case 'ledger':sheet='ledger';renderOverlay();break;case 'toggleLimit':act('toggleLimit');break;
    case 'closeSheet':sheet=null;renderOverlay();break;
    case 'rebuy':act('rebuy',+v).then(()=>{sheet=null;renderOverlay()});break;
    case 'leave':sheet=null;act('leave');break;
    case 'rbJoin':act('rbJoin',t.dataset.c,+t.dataset.i);break;
    case 'rbLeave':act('rbLeave');break;
    case 'rbStake':act('rbStake',+v);break;
    case 'closeDraw':drawShown=null;renderOverlay();break;
    case 'resetDemo':if(!armed('resetDemo'))break;
      Store.tx(()=>norm({}));ME='p'+Date.now().toString(36)+rnd(1e9).toString(36);
      try{sessionStorage.setItem('hashlama_pid',ME)}catch(_){}
      joinDraft={name:'',av:'🦁',buyin:100000,photo:null};sheet=null;drawShown=null;
      document.getElementById('app').innerHTML='';lastTable='';lastPanel='';render();break;
    case 'as':{
      ME=v==='new'?'p'+Date.now().toString(36)+rnd(1e9).toString(36):v;
      try{sessionStorage.setItem('hashlama_pid',ME)}catch(_){}
      joinDraft={name:'',av:AV_LIST[seated(S).length%AV_LIST.length],buyin:100000,photo:null};
      amountDraft=null;sheet=null;
      document.getElementById('app').innerHTML='';lastTable='';lastPanel='';render();break}
  }
});
render();
Store.sub(raw=>{const st=norm(raw?clean(raw):{});detect(PREV,st);S=st;loaded=true;render();PREV=clean(st)});
Store.subAv(a=>{AVS=a||{};lastTable='';render()});
</script>
